[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockscribe"
version = "0.1.0"
description = "Researches trending stock-market topics and generates cited, SEO-aware articles for a trading-literacy platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "feedparser>=6.0",
    "pytrends>=4.9",
    "PyYAML>=6.0",
    "markdown>=3.5",
]

[project.scripts]
stockscribe = "stockscribe.cli:main"

[tool.setuptools.packages.find]
include = ["stockscribe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
